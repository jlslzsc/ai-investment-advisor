# AI Investment Advisor - Nginx 配置
# 使用方法：
#   1. 修改下面的 root 路径为你的实际安装目录
#   2. cp nginx.conf /etc/nginx/sites-available/ai-advisor
#   3. ln -s /etc/nginx/sites-available/ai-advisor /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;  # 改成你的域名或 IP

    # 前端静态文件 - 修改为你的实际路径
    root /opt/repo/ai-investment-advisor/web/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # 前端路由（SPA）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（命令执行流式输出）
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # 长超时（匹配 Claude 执行时间）
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # 健康检查
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # 日志
    access_log /var/log/nginx/ai-advisor-access.log;
    error_log /var/log/nginx/ai-advisor-error.log;
}
